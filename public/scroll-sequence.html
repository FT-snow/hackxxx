<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mimir — Scroll Sequence</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: auto; }
  body {
    background: #000;
    color: #fff;
    font-family: ui-monospace, 'SF Mono', 'JetBrains Mono', monospace;
    -webkit-font-smoothing: antialiased;
  }
  .spacer {
    height: 100vh;
    display: flex;
    align-items: flex-end;
    padding: 8vh 6vw;
  }
  .label-meta {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: #888;
  }
  .sequence-section { position: relative; height: 100vh; overflow: hidden; }
  .sequence-canvas-wrap {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sequence-canvas {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
  }
  .sequence-caption {
    position: absolute;
    left: 6vw;
    bottom: 6vh;
    z-index: 3;
    pointer-events: none;
  }
  .sequence-caption h2 {
    font-family: 'Cinzel', Georgia, 'Times New Roman', serif;
    font-weight: 400;
    font-size: clamp(1.4rem, 3.5vw, 2.5rem);
    letter-spacing: 0.01em;
  }
  .loader {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #000;
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: center;
    justify-content: center;
    transition: opacity 0.6s ease;
  }
  .loader.done { opacity: 0; pointer-events: none; }
  .loader-bar {
    width: min(280px, 60vw);
    height: 1px;
    background: rgba(255,255,255,0.12);
    overflow: hidden;
  }
  .loader-fill {
    height: 100%;
    width: 0%;
    background: #E9C468;
    transition: width 0.25s ease;
  }
  .loader-error { color: #E9C468; font-size: 12px; letter-spacing: 0.08em; max-width: 70vw; text-align: center; }
</style>
</head>
<body>

<div class="loader" id="seqLoader">
  <span class="label-meta">The well remembers · loading</span>
  <div class="loader-bar"><div class="loader-fill" id="seqLoaderFill"></div></div>
  <span class="label-meta" id="seqLoaderPct">0%</span>
  <span class="loader-error" id="seqLoaderError" hidden></span>
</div>

<section class="spacer">
  <p class="label-meta">Scroll ↓</p>
</section>

<section class="sequence-section" id="seqSection">
  <div class="sequence-canvas-wrap">
    <canvas class="sequence-canvas" id="seqCanvas"></canvas>
  </div>
  <div class="sequence-caption">
    <h2>Every page, remembered.</h2>
  </div>
</section>

<div class="spacer">
  <p class="label-meta">Mimir</p>
</div>

<script>
gsap.registerPlugin(ScrollTrigger);

const SEQ = {
  count: 48,
  path: './frames/ezgif-frame-###.png',
  scrollLength: () => window.innerHeight * 4,
  caption: document.getElementById('seqSection').querySelector('.sequence-caption'),
};

function frameUrl(i) {
  return SEQ.path.replace('###', String(i + 1).padStart(3, '0'));
}

const state = { frame: 0 };
const canvas = document.getElementById('seqCanvas');
const ctx = canvas.getContext('2d');
let frames = [];
let renderedFrame = -1;

function sizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const { clientWidth: w, clientHeight: h } = canvas.parentElement;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
}

function drawCover(img) {
  const cw = canvas.width;
  const ch = canvas.height;
  const iw = img.naturalWidth || img.width;
  const ih = img.naturalHeight || img.height;
  const scale = Math.max(cw / iw, ch / ih);
  const dw = iw * scale;
  const dh = ih * scale;
  ctx.clearRect(0, 0, cw, ch);
  ctx.drawImage(img, (cw - dw) / 2, (ch - dh) / 2, dw, dh);
}

function render(frameIdx) {
  const i = Math.max(0, Math.min(frames.length - 1, Math.round(frameIdx)));
  if (i === renderedFrame || !frames[i]) return;
  renderedFrame = i;
  drawCover(frames[i]);
}

async function preload() {
  const fill = document.getElementById('seqLoaderFill');
  const pct = document.getElementById('seqLoaderPct');
  const errEl = document.getElementById('seqLoaderError');
  let loaded = 0;
  let failed = 0;

  const jobs = Array.from({ length: SEQ.count }, (_, i) =>
    new Promise((resolve) => {
      const img = new Image();
      img.decoding = 'async';
      img.onload = () => resolve({ ok: true, img });
      img.onerror = () => resolve({ ok: false, img: null });
      img.src = frameUrl(i);
    }).then((r) => {
      loaded++;
      if (!r.ok) failed++;
      fill.style.width = `${Math.round((loaded / SEQ.count) * 100)}%`;
      pct.textContent = `${Math.round((loaded / SEQ.count) * 100)}%`;
      return r;
    })
  );

  const results = await Promise.all(jobs);
  frames = results.filter((r) => r.ok).map((r) => r.img);

  if (frames.length === 0) {
    errEl.hidden = false;
    errEl.textContent =
      'No frames found in ./frames/ — drop your 48 PNGs there (ezgif-frame-001.png …).';
    return false;
  }
  if (failed > 0) {
    errEl.hidden = false;
    errEl.textContent = `${failed} frame(s) missing — playing ${frames.length}.`;
    setTimeout(() => (errEl.hidden = true), 3500);
  }

  await Promise.allSettled(frames.slice(0, 2).map((f) => f.decode?.()));
  return true;
}

function initSequence() {
  sizeCanvas();
  render(0);

  gsap.to(state, {
    frame: frames.length - 1,
    ease: 'none',
    scrollTrigger: {
      id: 'seq',
      trigger: '#seqSection',
      start: 'top top',
      end: () => `+=${SEQ.scrollLength()}`,
      pin: true,
      pinSpacing: true,
      scrub: 0.8,
      anticipatePin: 1,
      invalidateOnRefresh: true,
      onUpdate: () => render(state.frame),
    },
  });

  gsap.fromTo(
    '.sequence-caption',
    { opacity: 0, y: 24 },
    {
      opacity: 1,
      y: 0,
      duration: 0.7,
      scrollTrigger: { trigger: '#seqSection', start: 'top 60%' },
    }
  );

  window.addEventListener('resize', () => {
    sizeCanvas();
    renderedFrame = -1;
    render(state.frame);
  });

  ScrollTrigger.refresh();
  const loader = document.getElementById('seqLoader');
  loader.classList.add('done');
  setTimeout(() => loader.remove(), 700);
}

(async () => {
  const ok = await preload();
  if (ok) initSequence();
})();
</script>
</body>
</html>
